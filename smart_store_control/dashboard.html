<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>smart_store 관제</title>
<style>
:root{color-scheme:dark;--bg:#0b0f17;--panel:#131a26;--line:#243043;--text:#e7edf7;--muted:#8fa0b8;--blue:#7fb4ff;--green:#7ee2b1;--amber:#ffd27a;--red:#ff8fa3;--violet:#c5a8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1500px;margin:auto;padding:22px}
header{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:14px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.5px}h2{font-size:15px;margin:0}h3{font-size:14px;margin:0}
.muted{color:var(--muted)}small{color:var(--muted);font-size:12px}
.hero{display:grid;grid-template-columns:1.2fr 1fr 1fr 1fr;gap:12px;margin-bottom:14px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px}
.big{font-size:40px;font-weight:700;line-height:1.1;margin:4px 0}
.track{height:10px;background:#1f2a3b;border-radius:6px;overflow:hidden;margin:10px 0 6px}.fill{height:100%;background:linear-gradient(90deg,var(--blue),var(--green))}
.groups{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.group{font-size:12px;padding:3px 8px;border:1px solid var(--line);border-radius:14px}
.group.done{border-color:var(--green);color:var(--green)}
.needs{border-color:#6b4a1d;background:#1d1710}.needs h2{color:var(--amber)}
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin:14px 0}
.col{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;min-height:160px}
.col h2{display:flex;justify-content:space-between;margin-bottom:10px}.col h2 b{color:var(--muted);font-weight:500}
.card{background:#0f1520;border:1px solid var(--line);border-left:3px solid #4b5f80;border-radius:9px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.card:hover{border-color:var(--blue)}.card .t{font-weight:600;font-size:14px}.card .r{font-size:12px;color:var(--muted);margin-top:4px;overflow-wrap:anywhere}
.card.live{border-left-color:var(--green)}.card.stale{border-left-color:var(--red)}.card.review{border-left-color:var(--violet)}.card.blocked{border-left-color:var(--red)}.card.done{border-left-color:var(--green)}.card.decide{border-left-color:var(--amber)}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--green);margin-right:6px;vertical-align:middle}.dot.stale{background:var(--red)}.dot.idle{background:#5c6b82}
.chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:10px;background:#1c2738;color:#c7d5ea;margin-right:4px}
button{border:1px solid var(--line);background:#182233;color:var(--text);padding:6px 11px;border-radius:8px;cursor:pointer;font:inherit;font-size:13px}
button:hover{border-color:var(--blue)}button.primary{background:#1f4d3a;border-color:#2f7a5a}button.danger{background:#4a2330;border-color:#7a3448}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.drawer{position:fixed;top:0;right:0;width:min(760px,95vw);height:100vh;background:#0e141f;border-left:1px solid var(--line);padding:18px;overflow:auto;transform:translateX(100%);transition:transform .2s;z-index:9}
.drawer.open{transform:none}.drawer pre{background:#0a0e15;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:12px;white-space:pre-wrap;overflow-wrap:anywhere;max-height:40vh;overflow:auto}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
table{width:100%;border-collapse:collapse;font-size:13px}td,th{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line)}
.ok{color:var(--green)}.warn{color:var(--amber)}.bad{color:var(--red)}
details summary{cursor:pointer;color:var(--blue);font-size:13px}
@media(max-width:1100px){.board{grid-template-columns:repeat(2,1fr)}.hero{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><main>
<header>
  <div><div class="muted" style="font-size:11px;letter-spacing:2px">SMART_STORE · LOCAL CONTROL</div><h1>smart_store 관제</h1><small id="clock">연결 중…</small></div>
  <div class="row"><span id="engine" class="chip">엔진 확인 중</span><button id="refresh">새로고침</button><button id="pmrun">PM 실행</button><button id="recover">재점검·복구</button></div>
</header>

<section class="hero">
  <div class="panel"><small>마일스톤 진척</small><div class="big" id="msPercent">—</div><div class="track"><div class="fill" id="msFill"></div></div><small id="msCount"></small><div class="groups" id="msGroups"></div></div>
  <div class="panel"><small>작업 완료</small><div class="big" id="taskPercent">—</div><small id="taskCount"></small><div class="muted" style="margin-top:8px;font-size:13px" id="taskBreakdown"></div></div>
  <div class="panel"><small>지금 돌고 있는 것</small><div class="big" id="liveCount">—</div><small id="liveDetail"></small></div>
  <div class="panel"><small>워커 용량</small><div class="big" id="capacity">—</div><small id="capacityDetail"></small></div>
</section>

<section class="panel needs" id="needsPanel" style="margin-bottom:14px"><h2 id="needsTitle">내가 결정할 일</h2><div id="needs" style="margin-top:10px"></div></section>

<section class="board">
  <div class="col"><h2>대기 <b id="nReady"></b></h2><div id="colReady"></div></div>
  <div class="col"><h2>구현 중 <b id="nRun"></b></h2><div id="colRun"></div></div>
  <div class="col"><h2>게이트·리뷰 <b id="nReview"></b></h2><div id="colReview"></div></div>
  <div class="col"><h2>안착 완료 <b id="nDone"></b></h2><div id="colDone"></div></div>
  <div class="col"><h2>막힘 <b id="nBlocked"></b></h2><div id="colBlocked"></div></div>
</section>

<section class="two">
  <div class="panel"><h2>최근 활동</h2><table id="recent"></table></div>
  <div class="panel"><details><summary>마일스톤 표 (<span id="msTotal"></span>)</summary><table id="msTable" style="margin-top:8px"></table></details><details style="margin-top:10px"><summary>주차된 작업</summary><div id="parked" style="margin-top:8px"></div></details></div>
</section>
<p class="muted" style="font-size:12px" id="foot"></p>
</main>

<aside class="drawer" id="drawer"><div class="row" style="justify-content:space-between"><h2 id="dTitle">작업</h2><button id="dClose">닫기</button></div><div id="dBody" style="margin-top:12px"></div></aside>

<script>
const $=id=>document.getElementById(id);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const STAGE={claimed:'착수',llm_request:'모델 작업 중',review_gate:'테스트 게이트',review_llm:'모델 리뷰',requeued:'재대기',retry_queued:'재시도 대기',requeued_for_gate:'게이트 재검토 대기',landed:'브랜치 안착',finished:'완료',error:'오류',operator_approved:'승인됨',operator_rejected:'거부됨',parked:'주차'};
const ago=iso=>{if(!iso)return '';const s=Math.max(0,(Date.now()-Date.parse(iso))/1000);return s<60?`${Math.round(s)}초 전`:s<3600?`${Math.round(s/60)}분 전`:`${(s/3600).toFixed(1)}시간 전`};
function reason(t){return esc(t.note||t.last_error||'').slice(0,160)}  // current note first; history lives in the drawer
function card(t){const live=['in_progress','reviewing'].includes(t.status);const cls=live?(t.health==='stale'?'stale':'live'):t.status==='needs_review'?'review':t.status==='needs_decision'?'decide':t.status==='blocked'?'blocked':t.status==='done'?'done':'';
 const hb=live?`<span class="dot ${t.health==='stale'?'stale':''}"></span>heartbeat ${ago(t.heartbeat_at)}`:'';
 const stage=STAGE[t.phase]||t.phase||'';const esc_=t.escalation||{};const ladder=t.status==='escalated'?`Codex 위임 · job ${esc_.job_id} ${(esc_.codex||{}).status||'대기'}${(esc_.codex||{}).available_at?' · 재개 '+ago((esc_.codex||{}).available_at).replace(' 전',' 후'):''}`:t.phase==='needs_claude'?'Claude Code 조치 필요':null;
 const meta=[t.milestone,stage,ladder,t.retry_count?`재시도 ${t.retry_count}`:null,t.branch?`${t.branch}@${t.commit}`:null].filter(Boolean).map(x=>`<span class=chip>${esc(x)}</span>`).join('');
 return `<div class="card ${cls}" data-id="${esc(t.id)}"><div class=t>#${esc(t.id)} ${esc(t.title)}</div><div style="margin-top:4px">${meta}</div><div class=r>${hb} ${reason(t)}</div></div>`}
function render(d){const pm=d.pm||{},tasks=pm.tasks||[],p=d.progress||{},ms=p.milestones||{},tp=p.tasks||{},cap=pm.capacity||{};
 $('clock').textContent=`갱신 ${new Date().toLocaleTimeString()} · 서버 ${ago(d.server_time)}`;
 const llm=(d.runtime||{}).local_llm||{};$('engine').textContent=`${llm.engine||'http'} · ${llm.model||''} · ${llm.endpoint||''}`;
 $('msPercent').textContent=ms.percent==null?'—':ms.percent+'%';$('msFill').style.width=(ms.percent||0)+'%';$('msCount').textContent=`완료 ${ms.done} / 전체 ${ms.total}`;$('msTotal').textContent=ms.total;
 $('msGroups').innerHTML=(ms.groups||[]).map(g=>`<span class="group ${g.done===g.total?'done':''}">${esc(g.id)} ${g.done}/${g.total}</span>`).join('');
 $('taskPercent').textContent=tp.percent==null?'—':tp.percent+'%';$('taskCount').textContent=`안착 ${tp.done} / 작업 ${tp.total}`;
 const c=s=>tasks.filter(t=>t.status===s);const by={ready:c('ready'),run:[...c('in_progress'),...c('escalated')],review:[...c('needs_review'),...c('reviewing'),...c('reviewed')],done:c('done'),blocked:c('blocked'),decide:c('needs_decision'),planned:c('planned')};
 $('taskBreakdown').textContent=`대기 ${by.ready.length} · 구현 ${by.run.length} · 리뷰 ${by.review.length} · 막힘 ${by.blocked.length} · 결정 대기 ${by.decide.length}`;
 const live=[...by.run,...c('reviewing')];$('liveCount').textContent=live.length;$('liveDetail').innerHTML=live.map(t=>`<span class="dot ${t.health==='stale'?'stale':''}"></span>#${esc(t.id)} ${esc(STAGE[t.phase]||t.phase)} · ${ago(t.heartbeat_at)}`).join('<br>')||'없음';
 const lanes=pm.lanes||[];const total=lanes.reduce((s,l)=>s+(l.effective||0),0),conf=lanes.reduce((s,l)=>s+(l.configured||0),0);
 $('capacity').textContent=lanes.length?`${total} / ${conf}`:`${cap.effective??0} / ${cap.configured??0}`;
 $('capacityDetail').innerHTML=(lanes.map(l=>`${esc(l.role.replace('-impl',''))} ${l.effective}/${l.configured}`).join(' · ')||'')+`<br>AIOS 가용 ${cap.aios_available??0} · floor ${cap.operator_floor??0} · 핸드오프 ${cap.handoff_granted?'승인':'대기'}`;
 const sealed=by.blocked.filter(t=>Number(t.retry_count)>=3);const needs=[...by.decide,...sealed];
 $('needsTitle').textContent=`내가 결정할 일 (${needs.length})`;
 $('needs').innerHTML=needs.length?needs.map(t=>`<div class="card ${t.status==='needs_decision'?'decide':'blocked'}" data-id="${esc(t.id)}"><div class=t>#${esc(t.id)} ${esc(t.title)} <span class=chip>${t.status==='needs_decision'?'게이트 통과, 모델 반대':t.phase==='needs_claude'?'로컬·Codex 실패 → Claude Code':'재시도 소진'}</span></div><div class=r>${reason(t)}</div><div class=row style="margin-top:8px">${t.status==='needs_decision'?`<button class=primary data-act=approve data-id="${t.id}">승인하고 안착</button><button class=danger data-act=reject data-id="${t.id}">거부</button>`:`<button class=primary data-act=retry data-id="${t.id}">다시 시도</button>${t.artifact?`<button data-act=rereview data-id="${t.id}">패치 재검토</button>`:''}`}<button data-act=park data-id="${t.id}">주차</button></div></div>`).join(''):'<div class=muted>없음. 워커풀이 알아서 돌고 있습니다.</div>';
 const fill=(id,list,n)=>{$(id).innerHTML=list.map(card).join('')||'<div class=muted style="font-size:13px">비어 있음</div>';$(n).textContent=list.length};
 fill('colReady',by.ready,'nReady');fill('colRun',by.run,'nRun');fill('colReview',by.review,'nReview');fill('colDone',by.done,'nDone');fill('colBlocked',by.blocked.filter(t=>Number(t.retry_count)<3),'nBlocked');
 const recent=[...tasks].sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||''))).slice(0,12);
 $('recent').innerHTML=recent.map(t=>`<tr><td>${ago(t.updated_at)}</td><td>#${esc(t.id)}</td><td class="${t.status==='done'?'ok':t.status==='blocked'?'bad':t.status==='needs_decision'?'warn':''}">${esc(t.status)}</td><td>${reason(t).slice(0,90)}</td></tr>`).join('');
 const items=((d.milestones||{}).milestones||[]);$('msTable').innerHTML='<tr><th>ID</th><th>작업</th><th>상태</th><th>완료 조건</th></tr>'+items.map(m=>`<tr><td>${esc(m.id)}</td><td>${esc(m.title)}</td><td class="${m.status==='done'?'ok':''}">${esc(m.status)}</td><td class=muted>${esc(m.exit_criteria)}</td></tr>`).join('');
 $('parked').innerHTML=by.planned.map(card).join('')||'<span class=muted>없음</span>';
 const rec=d.pm_recovery||{},ap=d.autopilot||{},tr=d.triage||{};
 const trLines=(tr.recent||[]).slice(-3).reverse().map(e=>`${ago(e.at)}: `+e.actions.map(a=>`#${a.task} ${a.cause}→${a.action==='requeued'?'재대기':'운영자 에스컬레이션'}`).join(', ')).join(' | ');
 $('foot').innerHTML=`autopilot ${ap.enabled?'on':'off'} · 복구 ${esc(rec.status||'-')} ${rec.updated_at?ago(rec.updated_at):''} · 막힘 점검 10분 주기, 마지막 ${tr.last_run_at?ago(tr.last_run_at):'아직 없음'} <button id="triageNow" style="padding:2px 8px;font-size:12px">지금 점검</button><br>${esc(trLines)||'최근 자동 조치 없음'} · LLM 호출 0 (관제는 원장만 읽습니다)`;
 $('triageNow').onclick=async()=>{await fetch('/api/triage',{method:'POST'});load()};
}
async function load(){try{const r=await fetch('/api/control',{cache:'no-store'});render(await r.json())}catch(e){$('clock').textContent='서버에 연결할 수 없습니다'}}
async function act(id,action){const reason=action==='reject'||action==='approve'?prompt('사유(선택)')??'':'';const r=await fetch(`/api/task/${id}/${action}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({reason})});const j=await r.json();if(!r.ok)alert(j.error||'실패');load()}
async function open(id){const r=await fetch(`/api/task/${id}`,{cache:'no-store'});if(!r.ok)return;const d=await r.json(),t=d.task;$('dTitle').textContent=`#${t.id} ${t.title}`;
 const kv=[['상태',t.status],['단계',STAGE[t.phase]||t.phase],['마일스톤',t.milestone],['워커',t.worker||t.reviewer],['재시도',t.retry_count],['브랜치',t.branch?`${t.branch} @ ${t.commit}`:''],['갱신',t.updated_at]].filter(x=>x[1]!==undefined&&x[1]!==''&&x[1]!==null);
 const acts=['in_progress','reviewing'].includes(t.status)?'<span class=muted>실행 중에는 조작할 수 없습니다.</span>':`${t.status==='needs_decision'?'<button class=primary data-act=approve>승인하고 안착</button><button class=danger data-act=reject>거부</button>':''}<button data-act=retry>다시 시도</button>${t.artifact&&t.status!=='done'?'<button data-act=rereview>패치 재검토</button>':''}<button data-act=park>주차</button>`;
 $('dBody').innerHTML=`<table>${kv.map(([k,v])=>`<tr><th style="width:90px">${k}</th><td>${esc(v)}</td></tr>`).join('')}</table><p><b>사유·메모</b><br>${esc(t.note||'')}<br><span class=muted>${esc(t.last_error||'')}</span></p><p><b>요구사항</b><br><span class=muted>${esc(t.prompt||'')}</span></p><div class=row style="margin:8px 0">${acts}</div>${d.review?`<h3>리뷰·게이트</h3><pre>${esc(d.review)}</pre>`:''}${d.agent?`<h3>에이전트 요약</h3><pre>${esc(d.agent)}</pre>`:''}${d.patch?`<h3>패치</h3><pre>${esc(d.patch)}</pre>`:'<p class=muted>패치 없음</p>'}`;
 $('dBody').querySelectorAll('button[data-act]').forEach(b=>b.onclick=()=>act(t.id,b.dataset.act));$('drawer').classList.add('open')}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-act][data-id]');if(b){act(b.dataset.id,b.dataset.act);return}const c=e.target.closest('.card[data-id]');if(c&&!e.target.closest('button'))open(c.dataset.id)});
$('dClose').onclick=()=>$('drawer').classList.remove('open');$('refresh').onclick=load;
$('pmrun').onclick=async()=>{await fetch('/api/pm/run',{method:'POST'});load()};$('recover').onclick=async()=>{await fetch('/api/pm/recover',{method:'POST'});load()};
load();setInterval(()=>{if(!document.hidden)load()},10000);
</script>
</body></html>
