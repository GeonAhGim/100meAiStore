name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project
        run: python -m pip install -e .
      - name: Compile Python sources
        run: python -m compileall -q packages smart_store_aios tests
      - name: Run tests
        run: python -m unittest discover -v
      - name: Reject tracked secret and local-data files
        shell: bash
        run: |
          set -eu
          forbidden='(^|/)(\.env($|\.)|config\.json$|data/)|\.(pem|key|p12|pfx)$'
          if git ls-files | grep -E "$forbidden" | grep -v -E '(^|/)\.env\.example$'; then
            echo "Tracked secret or local-data filename detected."
            exit 1
          fi
