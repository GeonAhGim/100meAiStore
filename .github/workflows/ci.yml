name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build and test tools
        run: python -m pip install --upgrade pip setuptools wheel pytest
      - name: Install project
        run: python -m pip install -e .
      - name: Compile Python sources
        run: python -m compileall -q packages smart_store_aios tests
      - name: Run tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Verify unittest discovery
        run: python -m unittest discover -q
      - name: Reject whitespace errors
        run: git diff --check
      - name: Scan tracked files for secrets and local data
        run: python scripts/ci_security_scan.py
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 14

  clean-install-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --upgrade pip setuptools wheel pytest
      - name: Build and bootstrap installed wheel without network
        run: python -m pytest -q tests/test_core.py::CoreTests::test_installed_wheel_bootstraps_without_source_tree_or_network
