name: CI

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install build and test tools
        run: python -m pip install --upgrade pip setuptools wheel pytest
      - name: Install project
        run: python -m pip install -e .
      - name: Compile Python sources
        run: python -m compileall -q packages smart_store_aios tests
      - name: Run tests
        run: python -m pytest -q --junitxml=test-results.xml
      - name: Reject tracked secret and local-data files
        shell: bash
        run: |
          set -eu
          forbidden='(^|/)(\.env($|\.)|config\.json$|data/)|\.(pem|key|p12|pfx)$'
          if git ls-files | grep -E "$forbidden" | grep -v -E '(^|/)\.env\.example$'; then
            echo "Tracked secret or local-data filename detected."
            exit 1
          fi
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: test-results.xml
          if-no-files-found: warn
          retention-days: 14
